<svg width="480" height="640" viewBox="0 0 480 640" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Decorative illustration — dried branches in a glass vase">
  <defs>
    <filter id="ci-edge" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.015" numOctaves="2" seed="9" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="4" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <linearGradient id="ci-vase" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#dfe6df" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#c9d2c7" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="ci-leaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93a374"/>
      <stop offset="100%" stop-color="#5f7248"/>
    </linearGradient>
  </defs>

  <rect width="480" height="640" fill="#f6f1e9"/>

  <g filter="url(#ci-edge)">
    <path d="M190 380 L184 560 C184 580 296 580 296 560 L290 380 Z" fill="url(#ci-vase)" stroke="#8f8a7c" stroke-width="1.5"/>
    <ellipse cx="240" cy="380" rx="50" ry="10" fill="none" stroke="#8f8a7c" stroke-width="1.5"/>
  </g>

  <g filter="url(#ci-edge)" stroke="#6b4a2c" stroke-width="2.5" stroke-linecap="round" fill="none">
    <path d="M232 382 C226 300 214 220 196 150"/>
    <path d="M244 382 C246 290 252 210 244 120"/>
    <path d="M256 382 C266 310 282 250 300 190"/>
  </g>

  <g filter="url(#ci-edge)">
    <ellipse cx="196" cy="150" rx="7" ry="14" fill="url(#ci-leaf)" transform="rotate(-20 196 150)"/>
    <ellipse cx="204" cy="185" rx="6" ry="12" fill="url(#ci-leaf)" opacity="0.85" transform="rotate(10 204 185)"/>
    <ellipse cx="244" cy="120" rx="7" ry="15" fill="url(#ci-leaf)" transform="rotate(5 244 120)"/>
    <ellipse cx="238" cy="160" rx="6" ry="12" fill="url(#ci-leaf)" opacity="0.85" transform="rotate(-15 238 160)"/>
    <ellipse cx="300" cy="190" rx="7" ry="14" fill="url(#ci-leaf)" transform="rotate(25 300 190)"/>
    <ellipse cx="286" cy="225" rx="6" ry="12" fill="url(#ci-leaf)" opacity="0.85" transform="rotate(0 286 225)"/>
  </g>

  <g>
    <rect x="404" y="556" width="46" height="46" fill="#a6431f"/>
    <path d="M414 566 L440 566 M414 578 L440 578 M414 590 L440 590 M420 562 L420 594 M434 562 L434 594"
      stroke="#f6f1e9" stroke-width="2.5" stroke-linecap="round"/>
  </g>
</svg>
