<svg width="200" height="200" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="orangekoko watercolor orange mark">
  <defs>
    <filter id="wc-edge" x="-30%" y="-30%" width="160%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="2" seed="4" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="6" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <radialGradient id="orange-grad" cx="36%" cy="30%" r="78%">
      <stop offset="0%" stop-color="#f3af71"/>
      <stop offset="55%" stop-color="#dd7a34"/>
      <stop offset="100%" stop-color="#b7561f"/>
    </radialGradient>
    <linearGradient id="leaf-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93a374"/>
      <stop offset="100%" stop-color="#5f7248"/>
    </linearGradient>
  </defs>

  <g filter="url(#wc-edge)">
    <circle cx="100" cy="112" r="58" fill="url(#orange-grad)"/>
    <circle cx="82" cy="90" r="20" fill="#f6c48f" opacity="0.45"/>
  </g>

  <g filter="url(#wc-edge)">
    <path d="M100 62 C97 50 101 40 111 34 C108 45 108 54 104 63 Z" fill="url(#leaf-grad)"/>
    <path d="M101 64 C112 64 120 58 124 49 C118 60 108 66 100 70 Z" fill="url(#leaf-grad)" opacity="0.85"/>
    <path d="M101 63 C101 80 101 96 100 111" stroke="#6b4a2c" stroke-width="3" stroke-linecap="round" fill="none"/>
  </g>
</svg>
